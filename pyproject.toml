[project]
name = "yetanotherfilestorage"
version = "0.1.0"
description = "YAFS - You think this one's different? SQLAlchemy with PostgreSQL & FastAPI & Flet. Nothing new, actually. But... maybe it IS different, dude? Check it out and tell me :D"
authors = [
    {name = "Silletr",email = "silletr@duck.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy (>=2.1.8,<3.0.0)",
    "flet (>=1.1.2,<2.0.0)",
    "fastapi (>=0.163.1,<1.0.0)",
    "loguru (>=0.8.0,<0.9.0)",
    "psycopg[binary] (>=3.3.9,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.5,<0.18.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]

[tool.pyright]
venvPath = "/home/silletr/Projects"
venv = "YetAnotherFileStorageEnv"
